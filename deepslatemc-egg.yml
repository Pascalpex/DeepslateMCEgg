scripts:
  installation:
    script: |-
      #!/bin/ash
      # DeepslateMC Installation Script
      #
      # Server Files: /mnt/server
      
      if [ -z "${MINECRAFT_VERSION}" ]; then
          MINECRAFT_VERSION="latest"
      fi

      DOWNLOAD_URL="https://pascalpex.de/files/deepslate/${MINECRAFT_VERSION}/DeepslateMC.jar"

      cd /mnt/server

      echo -e "Downloading DeepslateMC version: ${MINECRAFT_VERSION}"
      echo -e "URL: ${DOWNLOAD_URL}"

      if [ -f ${SERVER_JARFILE} ]; then
          mv ${SERVER_JARFILE} ${SERVER_JARFILE}.old
          echo -e "Existing jar backed up as ${SERVER_JARFILE}.old"
      fi

      # Download using curl. -f fails on 404, -L follows redirects, -sS for progress.
      curl -o ${SERVER_JARFILE} -fLSL ${DOWNLOAD_URL}

      if [ $? -ne 0 ]; then
          echo -e "ERROR: Download failed. Please check if version '${MINECRAFT_VERSION}' exists."
          exit 1
      fi

      if [ ! -f server.properties ]; then
          echo -e "Downloading default server.properties..."
          curl -o server.properties https://raw.githubusercontent.com/pelican-eggs/minecraft/refs/heads/main/java/server.properties
      fi
      
      echo -e "Installation of DeepslateMC complete!"
    container: 'ghcr.io/pelican-eggs/installers:alpine'
    entrypoint: ash
